networks:
  demo_macvlan:
    driver: macvlan
    driver_opts:
      parent: ${PARENT_IFACE}
    ipam:
      config:
        - subnet: ${SUBNET}
          gateway: ${GATEWAY}

services:
  macvlan-shim-setup:
    profiles: ["macvlan-shim"]
    image: alpine
    container_name: macvlan-shim-setup
    network_mode: host
    cap_add:
      - NET_ADMIN
    privileged: true
    command: >
      sh -c "
        apk add --no-cache iproute2 || exit 1;
        if ip link show macvlan-shim >/dev/null 2>&1; then
          echo 'macvlan-shim already exists, skipping';
        else
          ip link add macvlan-shim link ${PARENT_IFACE} type macvlan mode bridge &&
          ip addr add ${SUBNET} dev macvlan-shim &&
          ip link set macvlan-shim up &&
          ip route add ${GATEWAY} dev macvlan-shim &&
          echo 'macvlan-shim created';
        fi
      "
    restart: "no"

  server-macvlan:
    profiles: ["buggy"]
    build: .
    container_name: server-macvlan
    command: ["-c", "nc -lk -p 5000"]
    networks:
      demo_macvlan:
        ipv4_address: ${SERVER_IP}
    tty: true
    stdin_open: true

  client-macvlan:
    profiles: ["buggy"]
    build: .
    container_name: client-macvlan
    command: ["-c", "sleep infinity"]
    networks:
      demo_macvlan:
        ipv4_address: ${CLIENT_IP}
    tty: true
    stdin_open: true